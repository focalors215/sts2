name: Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'android/res/drawable-nodpi/launcher_home.jpg'
      - 'android/res/font/material_symbols_rounded.ttf'
      - '.github/workflows/windows-launcher.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-launcher.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/frp-helper/go.mod
          cache-dependency-path: windows/frp-helper/go.sum
      # 联机小屋 frp 助手；联机组件 MOD 需要原版 sts2.dll 引用，CI 不构建（本地 tools/windows/build-online-mod.sh）。
      - run: go build -trimpath -ldflags "-s -w" -o ../resources/frp/sts2-frpc.exe .
        working-directory: windows/frp-helper
        env:
          CGO_ENABLED: '0'
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: sts2-cottage-launcher-windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
          if-no-files-found: error
