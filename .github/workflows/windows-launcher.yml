name: Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'android/res/drawable-nodpi/launcher_home.jpg'
      - 'android/res/font/material_symbols_rounded.ttf'
      - '.github/workflows/windows-launcher.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-launcher.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: sts2-cottage-launcher-windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
          if-no-files-found: error
